site_name: Rolling Ticker Extraction
site_description: An end-to-end broadcast news ticker-text extraction and evaluation pipeline.
repo_url: https://github.com/Sanjib-22/Rolling-Ticker-Text-Extraction
repo_name: Sanjib-22/Rolling-Ticker-Text-Extraction

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    primary: red
    accent: amber

nav:
  - Home: index.md
  - Detailed Explanation: report.md

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
