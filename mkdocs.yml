site_name: Rolling Ticker Extraction
site_description: An end-to-end broadcast news ticker-text extraction and evaluation pipeline.
repo_url: https://github.com/Sanjib-22/Rolling-Ticker-Text-Extraction
repo_name: Sanjib-22/Rolling-Ticker-Text-Extraction

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    primary: red
    accent: amber

nav:
  - Project Report: index.md
  - Setup & Installation Guide: Setup_Guide.md

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
